[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "depwatch-mcp"
version = "0.1.0"
description = "MCP server for dependency health (PyPI and npm) with a Claude agent that audits requirements files"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp>=1.2,<2", "anthropic>=0.40", "httpx>=0.27", "packaging>=23", "starlette>=0.37", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
depwatch-agent = "depwatch.cli:main"
depwatch-mcp-server = "depwatch.server:main"
depwatch-web = "depwatch.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
depwatch = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Starlette recommends httpx2, which needs Python 3.11+; this project supports 3.10.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
